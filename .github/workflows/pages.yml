name: Pages

on:
  push:
    branches: [main]
    paths: ["configurator/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the service worker cache with the commit
        run: sed -i "s/^const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::12}\";/" configurator/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: configurator
      - id: deployment
        uses: actions/deploy-pages@v4

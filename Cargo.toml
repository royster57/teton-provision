[workspace]
resolver = "3"
members = ["crates/teton-proto", "crates/teton-device"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/royster57/teton-provision"

[workspace.dependencies]
teton-proto = { path = "crates/teton-proto" }

anyhow = "1.0.104"
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
proptest = "1.11.0"
qrcode = "0.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
